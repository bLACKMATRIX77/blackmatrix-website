<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="100" cy="100" r="92" fill="url(#circleGrad)" stroke="url(#borderGrad)" stroke-width="4" />
  
  <!-- Candlesticks -->
  <line x1="55" y1="70" x2="55" y2="135" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <rect x="48" y="85" width="14" height="35" rx="3" fill="#10b981" />
  
  <line x1="85" y1="50" x2="85" y2="125" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <rect x="78" y="65" width="14" height="45" rx="3" fill="#10b981" />
  
  <line x1="115" y1="80" x2="115" y2="145" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
  <rect x="108" y="95" width="14" height="30" rx="3" fill="#ef4444" />
  
  <line x1="145" y1="40" x2="145" y2="115" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <rect x="138" y="55" width="14" height="40" rx="3" fill="#10b981" filter="url(#glow)" />

  <!-- Trendline curve with glow -->
  <path d="M 40 125 Q 75 105, 110 90 T 160 48" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Robot node glow -->
  <circle cx="160" cy="48" r="7" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="160" cy="48" r="3" fill="#ffffff" />
</svg>
